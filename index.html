<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spendly – Expense Tracker</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--bd:#e5e7ef;--ac:#5b5bf0;--ac2:#8b5cf6;--ok:#10b981;--bad:#ef4444;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--tx:#eceef5;--mut:#98a0b3;--bd:#2a2e3b;--ac:#7c7cff;--ac2:#a78bfa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--tx:#eceef5;--mut:#98a0b3;--bd:#2a2e3b;--ac:#7c7cff;--ac2:#a78bfa;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:24px;letter-spacing:-.4px}
h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.main{grid-template-columns:1fr 1fr;margin-bottom:14px}
@media(max-width:720px){.main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.card h2{margin:0 0 12px;font-size:15px}
.lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.big{font-size:26px;font-weight:700;margin-top:4px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .4s}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.pri{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff}
.ghost{background:transparent;border:1px solid var(--bd)}
.ai{background:linear-gradient(135deg,rgba(91,91,240,.1),rgba(139,92,246,.1));border-color:var(--ac)}
.ai ul{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.ai li{padding:10px 12px;background:var(--card);border-radius:10px;border:1px solid var(--bd)}
.chart{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.legend{display:grid;gap:6px;font-size:13px;min-width:140px}
.legend div{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.row .m{flex:1;min-width:0}
.row .m b,.row .m small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}
.del{background:none;color:var(--mut);padding:6px 8px}
.del:hover{color:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:24px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1><span>Spendly</span></h1><div class="sub">Track spending, stay on budget, get AI insights</div></div>
    <div class="tools">
      <button class="ghost" id="demo">Load demo data</button>
      <button class="ghost" id="csv">Export CSV</button>
    </div>
  </header>

  <div class="grid stats">
    <div class="card"><div class="lbl">Spent this month</div><div class="big" id="sMonth">₹0</div><div class="sub" id="sCount"></div></div>
    <div class="card"><div class="lbl">Monthly budget</div><div class="big"><input id="budget" type="number" min="0" step="500" style="font-size:20px;font-weight:700;padding:4px 8px;width:140px"></div>
      <div class="bar"><i id="bFill" style="width:0"></i></div><div class="sub" id="bTxt"></div></div>
    <div class="card"><div class="lbl">Daily average</div><div class="big" id="sAvg">₹0</div><div class="sub" id="sTop"></div></div>
  </div>

  <div class="grid main">
    <div class="card">
      <h2>Add expense</h2>
      <form id="f">
        <input class="full" id="note" placeholder="What did you spend on?" required maxlength="60">
        <input id="amt" type="number" min="1" step="0.01" placeholder="Amount (₹)" required>
        <input id="date" type="date" required>
        <select class="full" id="cat"></select>
        <button class="pri full" type="submit">Add expense</button>
      </form>
    </div>
    <div class="card">
      <h2>Spending by category</h2>
      <div class="chart"><svg id="donut" width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="Spending by category"></svg><div class="legend" id="legend"></div></div>
    </div>
  </div>

  <div class="card ai" style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">✨ AI insights</h2>
      <button class="pri" id="aiBtn">Analyze my spending</button>
    </div>
    <ul id="insights"><li class="sub">Smart tips based on your data appear below. Press the button for a deeper AI analysis.</li></ul>
  </div>

  <div class="card">
    <h2>Transactions</h2>
    <div class="filters"><select id="mf"></select></div>
    <div id="list"></div>
  </div>
</div>

<script>
const CATS={Food:["🍔","#f59e0b"],Transport:["🚌","#3b82f6"],Shopping:["🛍️","#ec4899"],Bills:["💡","#8b5cf6"],Health:["💊","#10b981"],Fun:["🎬","#ef4444"],Other:["📦","#6b7280"]};
const fmt=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(n);
const $=id=>document.getElementById(id);
let S={items:[],budget:20000};
try{const r=localStorage.getItem("spendly");if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem("spendly",JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
$("date").value=today();
$("cat").innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join("");
$("budget").value=S.budget;
let month=today().slice(0,7);

function months(){const m=new Set(S.items.map(i=>i.date.slice(0,7)));m.add(today().slice(0,7));return [...m].sort().reverse()}
function monthItems(){return S.items.filter(i=>i.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date))}
function byCat(items){const t={};items.forEach(i=>t[i.cat]=(t[i.cat]||0)+i.amt);return Object.entries(t).sort((a,b)=>b[1]-a[1])}

function render(){
  const mf=$("mf");mf.innerHTML=months().map(m=>`<option value="${m}" ${m===month?"selected":""}>${new Date(m+"-01").toLocaleString("en",{month:"long",year:"numeric"})}</option>`).join("");
  const items=monthItems(),total=items.reduce((s,i)=>s+i.amt,0);
  $("sMonth").textContent=fmt(total);$("sCount").textContent=items.length+" transactions";
  const pct=S.budget>0?total/S.budget*100:0;
  $("bFill").style.width=Math.min(pct,100)+"%";
  $("bFill").style.background=pct>100?"var(--bad)":"";
  $("bTxt").textContent=S.budget>0?(pct>100?fmt(total-S.budget)+" over budget":fmt(S.budget-total)+" left ("+Math.round(pct)+"% used)"):"Set a budget";
  const days=month===today().slice(0,7)?new Date().getDate():new Date(+month.slice(0,4),+month.slice(5),0).getDate();
  $("sAvg").textContent=fmt(total/days);
  const cats=byCat(items);
  $("sTop").textContent=cats.length?"Top: "+cats[0][0]+" ("+fmt(cats[0][1])+")":"No data yet";
  // donut
  const svg=$("donut");let h="",off=0;const R=60,C=2*Math.PI*R;
  h+=`<circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--bd)" stroke-width="22"/>`;
  cats.forEach(([c,v])=>{const l=v/total*C;h+=`<circle cx="85" cy="85" r="${R}" fill="none" stroke="${CATS[c][1]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`;off+=l});
  h+=`<text x="85" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="var(--tx)">${total?fmt(total):"–"}</text>`;
  svg.innerHTML=h;
  $("legend").innerHTML=cats.length?cats.map(([c,v])=>`<div><span class="dot" style="background:${CATS[c][1]}"></span>${c}<b style="margin-left:auto">${Math.round(v/total*100)}%</b></div>`).join(""):'<div class="sub">Add an expense to see the breakdown</div>';
  // list
  $("list").innerHTML=items.length?items.map(i=>`<div class="row"><div class="ic" style="background:${CATS[i.cat][1]}22">${CATS[i.cat][0]}</div><div class="m"><b></b><small>${i.cat} · ${new Date(i.date).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}</small></div><b>${fmt(i.amt)}</b><button class="del" data-id="${i.id}" aria-label="Delete">✕</button></div>`).join(""):'<div class="empty">No transactions this month</div>';
  [...$("list").querySelectorAll(".row .m b")].forEach((b,k)=>b.textContent=items[k].note);
  localInsights(items,total,cats);
}

function localInsights(items,total,cats){
  const out=[];
  if(!items.length){out.push("Add a few expenses and I’ll spot patterns for you.")}
  else{
    const top=cats[0];out.push(`${top[0]} is your biggest category at ${Math.round(top[1]/total*100)}% of spending.`);
    const pct=S.budget?total/S.budget*100:0;
    if(pct>100)out.push(`You’ve exceeded your budget by ${fmt(total-S.budget)}. Consider pausing non-essential spending.`);
    else if(pct>80)out.push(`You’ve used ${Math.round(pct)}% of your budget. Watch spending for the rest of the month.`);
    else if(S.budget)out.push(`You’re on track: ${fmt(S.budget-total)} remains in your budget.`);
    const big=[...items].sort((a,b)=>b.amt-a.amt)[0];out.push(`Largest expense: “${big.note}” at ${fmt(big.amt)}.`);
  }
  $("insights").innerHTML=out.map(()=>"<li></li>").join("");
  [...$("insights").children].forEach((li,k)=>li.textContent=out[k]);
}

$("f").onsubmit=e=>{e.preventDefault();
  S.items.push({id:Date.now()+""+Math.random().toString(36).slice(2,6),note:$("note").value.trim(),amt:+$("amt").value,date:$("date").value,cat:$("cat").value});
  save();month=$("date").value.slice(0,7);e.target.reset();$("date").value=today();render()};
$("list").onclick=e=>{const b=e.target.closest(".del");if(b){S.items=S.items.filter(i=>i.id!==b.dataset.id);save();render()}};
$("mf").onchange=e=>{month=e.target.value;render()};
$("budget").onchange=e=>{S.budget=Math.max(0,+e.target.value||0);save();render()};
$("demo").onclick=()=>{
  const d=[["Groceries",1850,"Food"],["Metro card",500,"Transport"],["Electricity bill",2300,"Bills"],["Dinner out",1400,"Food"],["Sneakers",3200,"Shopping"],["Movie night",700,"Fun"],["Pharmacy",450,"Health"],["Cab rides",1100,"Transport"],["Swiggy order",620,"Food"],["Internet",999,"Bills"],["Headphones",2499,"Shopping"],["Coffee",380,"Food"]];
  const t=new Date();
  d.forEach(([note,amt,cat],k)=>{const x=new Date(t);x.setDate(Math.max(1,t.getDate()-k*2));S.items.push({id:"d"+Date.now()+k,note,amt,cat,date:x.toISOString().slice(0,10)})});
  save();month=today().slice(0,7);render()};
$("csv").onclick=async()=>{
  const csv="Date,Category,Note,Amount\n"+S.items.map(i=>[i.date,i.cat,'"'+i.note.replace(/"/g,'""')+'"',i.amt].join(",")).join("\n");
  try{const dl=await claude.use("downloads");if(dl){await dl.save({filename:"expenses.csv",data:csv});return}}catch(e){}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="expenses.csv";a.click()}catch(e){}};

$("aiBtn").onclick=async()=>{
  const btn=$("aiBtn"),ul=$("insights"),items=monthItems();
  if(!items.length){return}
  btn.disabled=true;btn.textContent="Analyzing…";
  const total=items.reduce((s,i)=>s+i.amt,0);
  const data={currency:"INR",month,budget:S.budget,total,byCategory:Object.fromEntries(byCat(items)),transactions:items.map(i=>({d:i.date,c:i.cat,n:i.note,a:i.amt}))};
  try{
    let sample=null;
    try{if(typeof claude!=="undefined")sample=await claude.use("sample")}catch(e){}
    if(sample){
      const r=await sample("You are a friendly personal finance coach. Analyze this expense data (INR) and give exactly 5 short, specific insights: spending patterns, budget status, one unusual item, and 2 actionable money-saving tips. Plain text, one insight per line, each starting with '- ', no markdown, under 30 words each.\n\n"+JSON.stringify(data),{onText:({text})=>{show(text)}});
      show(r.text);
    }else{
      const res=await fetch("/api/insights",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
      const j=await res.json();
      if(!res.ok)throw new Error(j.error||"Request failed");
      show(j.insights);
    }
  }catch(e){ul.insertAdjacentHTML("beforeend","<li class='sub'>AI analysis isn’t available right now – the smart tips above still work.</li>")}
  btn.disabled=false;btn.textContent="Analyze my spending";
  function show(t){const ls=t.split("\n").map(l=>l.replace(/^[-•*]\s*/,"").trim()).filter(Boolean);
    ul.innerHTML=ls.map(()=>"<li></li>").join("");[...ul.children].forEach((li,k)=>li.textContent=ls[k])}
};
render();
</script>
</body>
</html>
